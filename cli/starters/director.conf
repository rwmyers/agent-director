# agent-director core configuration.
#
# This file is hand-edited and safe to commit. Machine-written state lives in
# state/, in the same format, so you can always read what director wrote.

# Which harness to spawn on when a workflow or task does not pin one. This is
# the answer given when the root was created; `director harnesses` lists every
# harness this binary can drive.
harness = {{harness}}

# When director is itself running inside a herdr pane, spawn into panes beside
# it in preference to `harness` above. A --harness flag and a workflow or task
# pin still win. Set to false to place strictly by what is written here.
# herdr_autodetect = false

# Where the DIRECTOR ITSELF is running, as opposed to where it sends work. It
# decides whether `director wait` can be backgrounded here and whether an
# engagement can ring this conversation when it needs you; `director attach`
# prints what it worked out. Detection is ambient, so name it here if it gets
# this wrong:
# host = herdr

# Everything under [harness.<name>] is handed to that adapter verbatim, with one
# exception director reads itself: `hosts` says what that harness offers a
# director sitting in it, and may only take away from what the adapter declares
# — asking for more than it declares is refused when the root is read. No
# adapter needs a section here, so both of these are examples rather than
# settings:
# [harness.claude-code]
# binary = claude
# hosts  = background
