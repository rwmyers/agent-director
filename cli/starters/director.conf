# agent-director core configuration.
#
# This file is hand-edited and safe to commit. Machine-written state lives in
# state/, in the same format, so you can always read what director wrote.

# Which harness to spawn on when a workflow or task does not pin one. This is
# the answer given when the root was created; `director harnesses` lists every
# harness this binary can drive.
harness = {{harness}}

# When director is itself running inside a herdr pane, spawn into panes beside
# it in preference to `harness` above. A --harness flag and a workflow or task
# pin still win. Set to false to place strictly by what is written here.
# herdr_autodetect = false

# Everything under [harness.<name>] is handed to that adapter verbatim and is
# never inspected by director itself. No adapter needs a section here — each
# has its own defaults — so this is an example rather than a setting:
# [harness.claude-code]
# binary = claude
