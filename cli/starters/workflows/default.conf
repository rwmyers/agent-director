# A starter workflow. Copy it, rename it, and make it yours — nothing here is
# built into director, and the task names below carry no special meaning.
#
# A workflow declares vocabulary and constraints. It deliberately declares no
# ordering: the director decides what to run and when, which is the only way an
# arbitrary flow stays possible.

description = Starter workflow: a read-only investigation task and a local-changes task.

[permission.read-only]
# Anything not listed is denied. An agent under this scope cannot edit files or
# run commands, so it cannot change or publish anything.
allow = read, search

[permission.write-local]
# Can change files and run commands, and therefore can also publish — which is
# why push is listed. A harness that cannot separate the two refuses to spawn
# rather than quietly granting more than this says.
allow = read, search, edit, execute, push

[task.investigate]
description          = Read-only investigation. Produces findings, changes nothing.
prompt               = ../prompts/investigate.md
permissions          = read-only
progress             = orienting, reading, drafting, delivered
terminal             = delivered
report_on            = progress-change, 5m
require_final_report = true

[task.implement]
description          = Makes changes in the working tree.
prompt               = ../prompts/implement.md
permissions          = write-local
progress             = planning, editing, testing, ready-for-review
terminal             = ready-for-review
report_on            = progress-change, 10m
require_final_report = true
